name: CI

# Runs on every PR and push to main. Deliberately needs zero secrets -
# tests run with TESTING=true (SQLite, no Azure), and Terraform is only
# validated/planned here, never applied - `apply` stays gated behind
# the manual-approval environment in provision-tenant.yml / a separate
# infra-apply workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app

      - name: Test
        env:
          TESTING: "true"
          LOG_JSON: "false"
        run: |
          cd app
          python -m pytest --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/coverage.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push - just proves the Dockerfile works)
        run: docker build -t tutortrack-api:ci ./app

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Init (no backend, no Azure credentials needed to validate syntax)
        working-directory: terraform
        run: terraform init -backend=false

      - name: Validate
        working-directory: terraform
        run: terraform validate
